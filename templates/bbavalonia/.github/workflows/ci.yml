name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # PublishTrimmed in the app's project runs the trim analyser on this build too, so the app's
      # own code is held to trim safety here, with warnings as errors.
      - name: Build
        run: dotnet build AppStem.slnx -c Release --nologo -warnaserror

      # The headless UI tests need no display: Avalonia.Headless renders nowhere.
      - name: Test
        run: dotnet test --solution AppStem.slnx --no-build -c Release

  # ⭐ The trimmed publish a release makes, on every push. The analyser in `build` cannot see compiled
  # XAML or the dependencies; ILLink can, and its warnings are held to src/AppStem/trim-warnings.txt
  # in both directions: a new one is a hazard, a missing one means ILLink stopped analysing Avalonia.
  trim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish trimmed
        shell: bash
        run: >
          set -o pipefail;
          dotnet publish src/AppStem/AppStem.csproj -c Release -r linux-x64 --self-contained
          --nologo -o publish/linux-x64 | tee trim-publish.log

      - name: Compare warnings with the baseline
        run: dotnet run --file scripts/check-trim-warnings.cs -- trim-publish.log src/AppStem/trim-warnings.txt

  # The family conventions: documentation at the root and in every top-level directory, the
  # description, topics, feature toggles and rulesets. See docs/repository-conventions.md in
  # Bennewitz.Ninja.Templates.
  #
  # ⭐ Red on a freshly generated repository, listing every gap, until each one is closed.
  #
  # ⚠ The job name is a required check in .github/repository.json. Renaming it means changing that
  # list and running `repo-conventions apply` in the same change, or every pull request blocks.
  conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the repository conventions
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check
